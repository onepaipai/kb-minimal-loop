spring:
  application:
    name: kb-minimal-loop
  servlet:
    multipart:
      # 上传上限：单文件 20MB（PDF 带图体积大），请求总量 30MB，超出直接拒绝
      max-file-size: 20MB
      max-request-size: 30MB
  datasource:
    # Neon Postgres 直连地址（非 -pooler 端点），5 个敏感值全部走环境变量，不写死
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      # 每次启动执行 schema.sql，语句均为 IF NOT EXISTS，可重复执行
      mode: always

langchain4j:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model-name: deepseek-flash
  dashscope:
    api-key: ${DASHSCOPE_API_KEY}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model-name: text-embedding-v4

management:
  endpoints:
    web:
      exposure:
        # 健康检查与基础信息对外开放，metrics 与 prometheus 走安全配置（需登录）
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
