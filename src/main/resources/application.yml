server:
  port: 8080

spring:
  datasource:
    # 云端 pgvector：默认用 Neon 免费库，连接串放环境变量，不要写进代码。
    # Neon 给的是 postgres://user:pass@host/neondb?sslmode=require，
    # 改成 JDBC 格式：jdbc:postgresql://host/neondb?sslmode=require
    # 一定用直连端点（不带 -pooler 的那个），别用 pooler 端点。
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kb}
    username: ${DB_USER:kb}
    password: ${DB_PASSWORD:kb}
  # 启动时执行 schema.sql 建表（chunk_embedding，vector(1024)）
  # schema.sql 第一行就是 CREATE EXTENSION IF NOT EXISTS vector，Neon 上也能跑；
  # 如果启动报扩展权限问题，先在 Neon SQL Editor 里手动跑一次这行再启动。
  sql:
    init:
      mode: always

app:
  # 聊天：DeepSeek，OpenAI 兼容，base-url 见 https://api-docs.deepseek.com/zh-cn/
  # 模型名用 deepseek-flash（2026-11-10 官网当前值；旧名 deepseek-chat 已下线，别用）
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    chat-model: deepseek-flash
  # 向量：阿里云百炼 DashScope，OpenAI 兼容模式
  # base-url 见百炼文档：北京地域 https://dashscope.aliyuncs.com/compatible-mode/v1
  # 模型 text-embedding-v4 默认 1024 维，和 vector(1024) 必须一致；换向量模型要重建表 + 重新 ingest
  dashscope:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    embed-model: text-embedding-v4
    dimension: 1024
  chunk:
    size: 500       # 每块最多 500 字符
    overlap: 100    # 相邻块重叠 100 字符，避免一句话被切断
