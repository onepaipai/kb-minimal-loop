spring:
  application:
    name: kb-minimal-loop
  servlet:
    multipart:
      # 上传上限：单文件 20MB（PDF 带图体积大），请求总量 30MB，超出直接拒绝
      max-file-size: 20MB
      max-request-size: 30MB
  datasource:
    # Neon Postgres 直连地址（非 -pooler 端点），5 个敏感值全部走环境变量，不写死
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      # 每次启动执行 schema.sql，语句均为 IF NOT EXISTS，可重复执行
      mode: always

langchain4j:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model-name: deepseek-flash
  dashscope:
    api-key: ${DASHSCOPE_API_KEY}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model-name: text-embedding-v4

app:
  rerank:
    # 神经重排：问答检索后用 qwen3-rerank 对候选块再排一遍；失败时回退 RRF 顺序，Key 复用 DASHSCOPE_API_KEY
    enabled: ${RERANK_ENABLED:true}
    model: ${RERANK_MODEL:qwen3-rerank}
    base-url: ${RERANK_BASE_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
  oidc:
    # 企业登录（通用 OIDC）：默认关闭；开启需在 IdP 注册应用并配这 4 个值，回调地址为 {baseUrl}/login/oauth2/code/kb
    enabled: ${OIDC_ENABLED:false}
    client-id: ${OIDC_CLIENT_ID:}
    client-secret: ${OIDC_CLIENT_SECRET:}
    issuer-uri: ${OIDC_ISSUER_URI:}

management:
  endpoints:
    web:
      exposure:
        # 健康检查与基础信息对外开放，metrics 与 prometheus 走安全配置（需登录）
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
